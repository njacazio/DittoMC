### beams
Beams:idA = 2212   # proton
Beams:idB = 2212   # proton
Beams:eCM = 13600. # GeV

Beams:frameType = 1

### processes
SoftQCD:inelastic = on # all inelastic processes

### decays
ParticleDecays:limitTau0 = on
ParticleDecays:tau0Max = 10.

### phase space cuts 
PhaseSpace:pTHatMin = 0.000000
PhaseSpace:pTHatMax = -1.000000

Random:setSeed = on
### For `PythiaParallel`, if you don't explicitly provide `Parallelism:seeds`, PYTHIA starts from `Random:seed` and increments it for each worker. But `Random:seed = 0` has the special meaning "derive a seed from the current time.
Random:seed = 1

111:mayDecay = off
310:mayDecay = off
3122:mayDecay = off
-3122:mayDecay = off